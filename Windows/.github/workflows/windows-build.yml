name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autotools
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libtool
      - name: Build bundled libmobi converter
        shell: msys2 {0}
        run: bash scripts/build-libmobi-windows.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Reading-Companion-Open-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
